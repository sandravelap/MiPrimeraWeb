<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/form.css">
    <script src="../code/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Mis Pirineos</h1>
        <h2>Formulario</h2>
    </header>
    <nav>
        <div class="divNav">
            <a href="normas.html">
                <button class="navBtn">Normas</button>
            </a>
        </div>
        <div class="divNav">
            <a href="grid.html">
                <button class="navBtn">Grid</button>
            </a>
        </div>
        <div class="divNav">
            <a href="../index.html">
                <button class="navBtn">Inicio</button>
            </a>
        </div>
        <div class="divNav">
            <a href="pages/pag4.html">
                <button class="navBtn">Pag4</button>
            </a>
        </div>
    </nav>
    <main>
        <section>
            <!--action sería la función del servidor que recibiría los datos del formulario-->
            <!--en este caso no hace nada porque no tenemos server-->
            <form action="action.php">
                <fieldset>
                    <legend>Quiz</legend>
                    <!--name es el atributo que permite luego programar con js-->
                    <label for="userName">Introduzca su curso: </label>
                    <!--el atributo required se utiliza con el button submit únicamente-->
                    <input type="text" id="userName" placeholder="Nombre" required><br>
                    <label for="userPassword">Introduzca su password: </label>
                    <input type="password" id="userPassword" autocomplete=""><br>
                    <!--aquí están las opciones de suscripción asociadas por name = list-->
                    <label for="list">¿Desea subscribirse a nuestra lista de distribución?</label><br>
                    <label for="list">Sí</label><input type="radio" name="list"><br>
                    <label for="list">No</label><input type="radio" name="list"><br>
                    <label for="list">No lo tengo claro</label><input type="radio" name="list"><br>
                    <!--aquí están las opciones de soporte económico asociadas por name=channel-->
                    <label for="channel">¿Quieres contribuir económicamente a nuestro canal?</label><br>
                    <label for="channel">Sí</label><input type="radio" name="channel"><br>
                    <label for="channel">No</label><input type="radio" name="channel"><br>
                    <label for="lenguajes">¿Cuáles de los siguientes son lenguajes de marcas?</label><br>
                    <!--name permite luego al programa que procesa la información agruparla correctamente-->
                    <!--value es el valor con el que luego trabaja el programa que almacena la info-->
                    <label for="lenguajes">Java Script</label><input type="checkbox" name="lenguajes"
                        value="play"><br>
                    <label for="lenguajes">Html</label><input type="checkbox" name="lenguajes"
                        value="html"><br>
                    <label for="lenguajes">CSS</label><input type="checkbox" name="lenguajes" value="css"><br>
                    <label for="lenguajes">Typescript</label><input type="checkbox" name="lenguajes"
                        value="ts"><br>
                    <label for="nacimiento">Introduce tu fecha de nacimiento: </label>
                    <!--el atributo required obliga al usuario a introducir algo en el input antes de enviar-->
                    <input type="date" id="nacimiento" required><br>
                    <label for="colorHoy">¿De qué color estás hoy?</label>
                    <input type="color" name="colorHoy">
                    <br><br>
                    <!--submit es el botón de enviar al servidor según el atributo action del form,
                 el contenido es el texto que aparece en el botón-->
                    <button type="submit">Enviar</button>
                    <!--hago un botón estándar para comprobar las respuestas en mi propio navegador
                sin tener que delegar el código en el servidor-->
                    <button type="button" id="btnComprobar">Comprobar</button>
                    <!--reset es el botón de limpiar los datos introducidos, value es su texto-->
                    <button type="reset">Limpiar</button>
                </fieldset>
            </form>
        </section>
        <section>
            <div id="divRespuestas"></div>
        </section>
    </main>
    <footer>
        <h6>El corazón en los valles, el alma en las cumbres. Explora los Pirineos.</h6>
    </footer>
</body>

</html>
